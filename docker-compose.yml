services:
  postgis:
    image: postgis/postgis:16-3.4
    platform: linux/amd64
    container_name: road-risk-postgis
    restart: unless-stopped
    environment:
      POSTGRES_DB: road_risk
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5433:5432"
    volumes:
      - road_risk_postgis_data:/var/lib/postgresql/data
      - ./sql/create_postgis_tables.sql:/docker-entrypoint-initdb.d/01_create_postgis_tables.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d road_risk"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  road_risk_postgis_data:
